<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Salesforce Interactions Resolver</title>
  <style>
    body {
      width: 280px;
      padding: 12px 16px;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 14px;
      margin: 0;
    }
    h2 {
      margin: 0 0 12px;
      font-size: 16px;
      font-weight: 600;
    }
    .status {
      margin-bottom: 12px;
      padding: 8px 10px;
      border-radius: 6px;
      background: #f0f0f0;
      color: #333;
    }
    .status.connected {
      background: #e6f4ea;
      color: #137333;
    }
    .status.disconnected {
      background: #fef7e0;
      color: #7d6600;
    }
    .status.error {
      background: #fce8e6;
      color: #c5221f;
    }
    .buttons {
      display: flex;
      gap: 8px;
    }
    button {
      flex: 1;
      padding: 8px 12px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    #btnConnect {
      background: #1a73e8;
      color: white;
    }
    #btnConnect:hover:not(:disabled) {
      background: #1557b0;
    }
    #btnDisconnect {
      background: #dadce0;
      color: #3c4043;
    }
    #btnDisconnect:hover:not(:disabled) {
      background: #bdc1c6;
    }
    .ip-line {
      margin-bottom: 12px;
      font-size: 12px;
      color: #5f6368;
    }
  </style>
</head>
<body>
  <h2>Salesforce Interactions Resolver</h2>
  <div id="status" class="status disconnected">Checking…</div>
  <div id="myIp" class="ip-line">Your IP: —</div>
  <div class="buttons">
    <button id="btnConnect" type="button">Connect</button>
    <button id="btnDisconnect" type="button">Disconnect</button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
